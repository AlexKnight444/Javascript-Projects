<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assignment 3: Conditional Logic</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <main>
    <section class="card">
      <h1>Assignment 3: Conditional Logic</h1>
      <p class="task"><strong>Task:</strong> Use if...else, switch and a ternary operator to evaluate a test score.</p>
      <button id="runBtn">&#9654; Run Program</button>
      <p><small>Output also appears in the browser console (F12 &rarr; Console).</small></p>
      <pre id="output">Click "Run Program" to start...
</pre>
    </section>
  </main>

  <script src="../assets/output.js"></script>
  <script src="script.js"></script>
  <script>
    document.getElementById("runBtn").addEventListener("click", () => {
      document.getElementById("output").textContent = "";
      main();
    });
  </script>
</body>
</html>
